name: Reusable MERN Stack CI Template

on:
  workflow_call:
    inputs:
      project-type:
        required: true
        type: string # 'backend', 'react', or 'nextjs'
      node-version:
        required: false
        type: string
        default: '24.x'
      install-flags:
        required: false
        type: string
        default: ''

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Clean Deterministic Install
        run: npm ci

      - name: Security & Code Quality Audits
        run: |
          npm audit --audit-level=high || true
          npm run lint --if-present
          npm run test --if-present

      - name: Compile Application (Frontend / TypeScript)
        if: ${{ inputs.project-type == 'nextjs' }}
        env:
          NEXT_PUBLIC_API: ${{ secrets.DEV_API }}
          # Add any other build-time API base URL your getStaticProps needs:
          # API: ${{ secrets.NEXT_PUBLIC_API }}
        run: npm run build --if-present

      # -------------------------------------------------------------
      # 1. BACKEND ARTIFACT (Plain JS / TS Express API)
      # Packages source code while ignoring heavy/unnecessary folders
      # -------------------------------------------------------------
      - name: Package Backend Artifact
        if: ${{ inputs.project-type == 'backend' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: |
            ./
            !node_modules/
            !.git/
            !.github/
            !.env
            !tests/
            !coverage/
          include-hidden-files: true
          retention-days: 3

      # -------------------------------------------------------------
      # 2. NEXT.JS STANDALONE ARTIFACT
      # Packages standalone server, static assets, public folder, and PM2 config
      # -------------------------------------------------------------
      - name: Package Next.js Standalone Artifact
        if: ${{ inputs.project-type == 'nextjs' }}
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-artifact
          path: |
            .next/standalone/
            .next/static/
            public/
            .next/BUILD_ID
            ecosystem.config.js
            package.json
          retention-days: 3

      # -------------------------------------------------------------
      # 3. REACT SPA ARTIFACT
      # Packages compiled static build folder (e.g., build/ or dist/)
      # -------------------------------------------------------------
      - name: Package React SPA Artifact
        if: ${{ inputs.project-type == 'react' }}
        uses: actions/upload-artifact@v4
        with:
          name: react-artifact
          path: |
            build/
            # Fallback if Vite is used instead of Create React App:
            # dist/ 
          retention-days: 3
